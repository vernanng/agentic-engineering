name: CD

# CD without Docker, and no local deploy: push to main is the only deploy.
# A GitHub-hosted runner SSHes to the VM (secrets VM_HOST / VM_USER /
# VM_SSH_KEY), which pulls main into the real checkout and runs
# scripts/deploy.sh there (gate, backup, build, swap, health-check,
# rollback via systemd). Free: GitHub-hosted minutes are $0 on public repos.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 "$VM_USER@$VM_HOST" \
            'cd /root/project/agentic-engineering && git pull --ff-only origin main && bash scripts/deploy.sh'
      - name: Show service log on failure
        if: failure()
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 "$VM_USER@$VM_HOST" \
            'tail -n 50 /root/project/agentic-engineering/loop-app.log' || true
