name: CD

# Local-first CD without Docker: the self-hosted runner on this machine
# pulls main into the real checkout and runs its deploy.sh (gate, build,
# swap, health-check, rollback). The Actions checkout is not deployed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, macOS]
    steps:
      - name: Pull main + deploy
        run: |
          cd /Users/vernantjoa/projects/agentic-engineering
          git pull --ff-only origin main
          ./deploy.sh
      - name: Show service log on failure
        if: failure()
        run: tail -n 50 /Users/vernantjoa/projects/agentic-engineering/loop-app.log || true
