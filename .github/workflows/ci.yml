name: CI

# Fast feedback off this machine: cached, debug gate. Branch pushes run on
# the VPS self-hosted runner (label loop-vps); pull_request runs stay on
# GitHub-hosted Ubuntu because this repo is public and fork code must never
# execute on the VPS. Deploy stays in cd.yml (push to main only).
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["self-hosted", "loop-vps"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Gate
        run: cargo test --locked --test gate
