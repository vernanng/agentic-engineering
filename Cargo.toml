[package]
name = "loop-app"
version = "0.1.0"
edition = "2021"

[dependencies]
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
roxmltree = "0.20"
sha2 = "0.10"

[profile.release]
opt-level = 2
